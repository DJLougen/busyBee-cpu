<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">busyBee-cpu HermesAgent-20 model comparison</title>
  <desc id="desc">HermesAgent-20 score comparison: busyBee-cpu 96, Qwopus3.5-9B-Coder 85, Qwen3.5-9B 71, Qwen3.5-9B-Agent 68, Harmonic-Hermes-9B 47.</desc>
  <rect width="960" height="520" fill="#0f172a"/>
  <rect x="28" y="28" width="904" height="464" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>

  <text x="56" y="72" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">HermesAgent-20 Score Comparison</text>
  <text x="56" y="102" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#cbd5e1">busyBee-cpu is a CPU policy/offload adapter; others are 9B-class generative controllers from public HF cards.</text>

  <g transform="translate(56 132)">
    <rect x="0" y="0" width="848" height="58" rx="12" fill="#0b1220" stroke="#1e293b"/>
    <text x="22" y="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">busyBee-cpu runtime</text>
    <text x="22" y="46" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#dbeafe">CPU only, no GPU required, no neural generation in the hot path, full 20-scenario run in about 30.4s.</text>
  </g>

  <g transform="translate(56 228)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="0" y="-20" font-size="13" fill="#94a3b8">System</text>
    <text x="784" y="-20" text-anchor="end" font-size="13" fill="#94a3b8">Score</text>

    <g transform="translate(0 0)">
      <text x="0" y="20" font-size="15" font-weight="700" fill="#f8fafc">busyBee-cpu</text>
      <rect x="230" y="3" width="560" height="24" rx="6" fill="#1e293b"/>
      <rect x="230" y="3" width="538" height="24" rx="6" fill="#22c55e"/>
      <text x="812" y="21" font-size="20" font-weight="800" fill="#bbf7d0">96</text>
      <text x="0" y="42" font-size="12" fill="#86efac">CPU adapter, deterministic resolvers</text>
    </g>

    <g transform="translate(0 70)">
      <text x="0" y="20" font-size="15" font-weight="700" fill="#f8fafc">Qwopus3.5-9B-Coder</text>
      <rect x="230" y="3" width="560" height="24" rx="6" fill="#1e293b"/>
      <rect x="230" y="3" width="476" height="24" rx="6" fill="#38bdf8"/>
      <text x="812" y="21" font-size="20" font-weight="800" fill="#bae6fd">85</text>
      <text x="0" y="42" font-size="12" fill="#93c5fd">9B generative controller</text>
    </g>

    <g transform="translate(0 140)">
      <text x="0" y="20" font-size="15" font-weight="700" fill="#f8fafc">Qwen3.5-9B</text>
      <rect x="230" y="3" width="560" height="24" rx="6" fill="#1e293b"/>
      <rect x="230" y="3" width="398" height="24" rx="6" fill="#a78bfa"/>
      <text x="812" y="21" font-size="20" font-weight="800" fill="#ddd6fe">71</text>
      <text x="0" y="42" font-size="12" fill="#c4b5fd">9B baseline</text>
    </g>

    <g transform="translate(0 210)">
      <text x="0" y="20" font-size="15" font-weight="700" fill="#f8fafc">Qwen3.5-9B-Agent</text>
      <rect x="230" y="3" width="560" height="24" rx="6" fill="#1e293b"/>
      <rect x="230" y="3" width="381" height="24" rx="6" fill="#f59e0b"/>
      <text x="812" y="21" font-size="20" font-weight="800" fill="#fde68a">68</text>
      <text x="0" y="42" font-size="12" fill="#fcd34d">9B agent-tuned model</text>
    </g>

    <g transform="translate(0 280)">
      <text x="0" y="20" font-size="15" font-weight="700" fill="#f8fafc">Harmonic-Hermes-9B</text>
      <rect x="230" y="3" width="560" height="24" rx="6" fill="#1e293b"/>
      <rect x="230" y="3" width="263" height="24" rx="6" fill="#fb7185"/>
      <text x="812" y="21" font-size="20" font-weight="800" fill="#fecdd3">47</text>
      <text x="0" y="42" font-size="12" fill="#fda4af">9B Hermes-tuned model</text>
    </g>
  </g>
</svg>
