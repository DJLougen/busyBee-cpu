<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">busyBee-cpu evaluation results</title>
  <desc id="desc">Key metrics: 96.4% routing accuracy on 11,881 unseen examples, 20/20 Hermes scenarios, 819 training examples.</desc>
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#0c1222"/></linearGradient>
    <linearGradient id="rgreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient>
    <linearGradient id="rblue" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="rviolet" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="340" fill="url(#rbg)"/>
  <rect x="20" y="20" width="840" height="300" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <text x="48" y="58" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f8fafc">Evaluation on Unseen Data</text>
  <text x="48" y="78" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b">Combined model (819 training examples) · No contaminated results</text>

  <!-- Metric Cards -->
  <!-- Card 1: Routing Accuracy -->
  <rect x="48" y="100" width="244" height="120" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="170" y="148" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="900" fill="#22c55e" text-anchor="middle">96.4%</text>
  <text x="170" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Routing Accuracy</text>
  <text x="170" y="190" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">11,881 unseen SWE-bench examples</text>

  <!-- Card 2: Hermes Scenarios -->
  <rect x="318" y="100" width="244" height="120" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="440" y="148" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="900" fill="#3b82f6" text-anchor="middle">20/20</text>
  <text x="440" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Hermes Scenarios</text>
  <text x="440" y="190" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">All pass end-to-end via policy offload</text>

  <!-- Card 3: Training Size -->
  <rect x="588" y="100" width="244" height="120" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="710" y="148" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="900" fill="#8b5cf6" text-anchor="middle">819</text>
  <text x="710" y="172" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Training Examples</text>
  <text x="710" y="190" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">19 real + 800 synthetic</text>

  <!-- Scaling comparison -->
  <text x="48" y="250" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">Training size vs accuracy:</text>

  <!-- 19 examples bar -->
  <text x="48" y="272" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">19 examples</text>
  <rect x="170" y="261" width="500" height="16" rx="4" fill="#1e293b"/>
  <rect x="170" y="261" width="419" height="16" rx="4" fill="url(#rviolet)" opacity="0.6"/>
  <text x="600" y="273" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#c4b5fd">83.8%</text>

  <!-- 819 examples bar -->
  <text x="48" y="294" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">819 examples</text>
  <rect x="170" y="283" width="500" height="16" rx="4" fill="#1e293b"/>
  <rect x="170" y="283" width="482" height="16" rx="4" fill="url(#rgreen)"/>
  <text x="660" y="295" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#86efac">96.4%</text>

  <!-- 14,718 examples bar -->
  <text x="48" y="316" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">14,718 examples</text>
  <rect x="170" y="305" width="500" height="16" rx="4" fill="#1e293b"/>
  <rect x="170" y="305" width="500" height="16" rx="4" fill="url(#rblue)" opacity="0.7"/>
  <text x="678" y="317" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#93c5fd">~100%</text>

  <!-- Diminishing returns annotation -->
  <text x="730" y="294" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#f59e0b" font-style="italic">sweet spot</text>
</svg>
