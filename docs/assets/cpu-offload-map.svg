<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">busyBee-cpu offload map</title>
  <desc id="desc">Map of HermesAgent-20 categories handled by CPU offload and the remaining browser automation gap.</desc>
  <rect width="960" height="500" fill="#f8fafc"/>
  <text x="48" y="58" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" fill="#0f172a">CPU Offload Boundary</text>
  <text x="48" y="88" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">19 scenarios pass through bounded CPU policy + deterministic resolvers. Browser automation stays with Hermes.</text>

  <g transform="translate(48 128)">
    <rect x="0" y="0" width="620" height="310" rx="14" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
    <text x="28" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#14532d">Replace / Offload to CPU</text>
    <text x="28" y="74" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#166534">Strict tool traces, bounded transforms, local state and file operations</text>

    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#052e16">
      <text x="28" y="118">HA-01 memory replace</text>
      <text x="28" y="148">HA-02 memory curation</text>
      <text x="28" y="178">HA-03 injection guard</text>
      <text x="28" y="208">HA-04 recall + compose patch</text>
      <text x="28" y="238">HA-05 debug repair</text>
      <text x="28" y="268">HA-06 background process</text>

      <text x="300" y="118">HA-07 JSON aggregation</text>
      <text x="300" y="148">HA-09 skill create</text>
      <text x="300" y="178">HA-10 skill apply</text>
      <text x="300" y="208">HA-11 skill patch</text>
      <text x="300" y="238">HA-12 supporting file</text>
      <text x="300" y="268">HA-13-16 cron + messaging</text>
      <text x="300" y="298">HA-17-20 delegation + safety</text>
    </g>
  </g>

  <g transform="translate(700 128)">
    <rect x="0" y="0" width="212" height="310" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="24" y="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="750" fill="#7c2d12">Keep in Hermes</text>
    <text x="24" y="74" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a3412">Needs browser tools and DOM-grounded verification</text>
    <rect x="24" y="112" width="164" height="70" rx="12" fill="#fed7aa"/>
    <text x="106" y="143" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="750" fill="#7c2d12">HA-08</text>
    <text x="106" y="166" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#7c2d12">browser export</text>
    <text x="24" y="226" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a3412">Boundary rule:</text>
    <text x="24" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a3412">CPU owns exact</text>
    <text x="24" y="274" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a3412">state transforms;</text>
    <text x="24" y="296" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#9a3412">Hermes owns UI.</text>
  </g>
</svg>
